<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LegX Train — Estrazione</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b1424'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%23f5c842'%3E%F0%9F%97%A1%3C/text%3E%3C/svg%3E"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230b1424'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%23f5c842'%3E%F0%9F%97%A1%3C/text%3E%3C/svg%3E"/>
<meta name="theme-color" content="#0b1424"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="legX"/>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<style>
  :root {
    --gold:   #f5c842;
    --bg:     #090e1a;
    --panel:  #0d1628;
    --border: #1e3050;
    --accent: #38bdf8;
    --violet: #6366f1;
    --silver: #a8b8d0;
    --muted:  #4a6080;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg); color: #e2eaf5;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh; padding: 26px 16px 50px; text-align: center;
    background-image:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(56,189,248,0.08) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(30,48,80,0.3) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(30,48,80,0.15) 40px);
  }

  header h1 {
    font-size: 1.7rem; font-weight: 700; letter-spacing: 2px;
    color: var(--accent); text-shadow: 0 0 24px rgba(56,189,248,0.5);
  }
  header p { color: var(--silver); font-size: .85rem; letter-spacing: 2px; margin-top: 4px; }

  /* ── Pannelli tabelle ── */
  .container {
    display: flex; flex-direction: column; gap: 16px;
    max-width: 720px; margin: 24px auto 0;
  }
  @media (min-width: 760px) { .container { flex-direction: row; justify-content: center; align-items: stretch; } }

  .box {
    flex: 1; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 18px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
  }
  /* la tabella riempie il box e centra le righe: box di pari altezza, niente buco in basso */
  .tbl { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .box h3 {
    margin-bottom: 12px; color: var(--accent);
    font-size: 1.05rem; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: .92rem; padding: 5px 6px; border-bottom: 1px solid rgba(30,48,80,0.5);
  }
  .row:last-child { border-bottom: none; }
  .row b { font-weight: 700; color: #e2eaf5; }
  .row .pct { font-family: 'Share Tech Mono', monospace; color: var(--silver); }
  .row .each { font-size: .72rem; color: var(--muted); letter-spacing: .5px; }
  .row.total { margin-top: 4px; border-top: 1px solid var(--border); border-bottom: none; }
  .row.total b { color: var(--accent); text-transform: uppercase; font-size: .82rem; letter-spacing: 1px; }
  .row.total .pct { color: var(--accent); }

  /* ── Zona estrazione ── */
  .draw {
    max-width: 720px; margin: 26px auto 0;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px 18px;
  }
  .reels { display: flex; justify-content: center; gap: 22px; margin-bottom: 6px; flex-wrap: wrap; }
  .reel { min-width: 130px; }
  .reel .lbl {
    font-size: .8rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--silver); margin-bottom: 4px;
  }
  .reel .val {
    font-family: 'Share Tech Mono', monospace; font-size: 3.4rem; font-weight: 700;
    line-height: 1; transition: transform .12s ease;
  }
  .reel.train .val  { color: var(--accent); text-shadow: 0 0 18px rgba(56,189,248,0.5); }
  .reel.vip   .val  { color: var(--gold);   text-shadow: 0 0 18px rgba(245,200,66,0.5); }
  .reel .val.pulse { transform: scale(1.18); }

  .explain {
    min-height: 22px; margin: 10px auto 4px; max-width: 520px;
    font-size: .92rem; color: var(--silver); letter-spacing: .5px;
  }
  .explain b.train { color: var(--accent); }
  .explain b.vip   { color: var(--gold); }

  button.estrai {
    margin: 16px auto 0; padding: 15px 40px; width: 90%; max-width: 380px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--violet));
    color: #fff; font-family: 'Rajdhani', sans-serif;
    font-size: 1.15rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 0 20px rgba(99,102,241,0.4);
    transition: opacity .2s, transform .15s;
  }
  button.estrai:hover { opacity: .92; transform: translateY(-1px); }
  button.estrai:active { transform: none; }
  button.estrai:disabled { opacity: .55; cursor: not-allowed; transform: none; }

  .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .btn-group button.estrai { width: auto; margin: 0; padding: 13px 22px; font-size: 1rem; letter-spacing: 1px; }
  button.estrai.secondary { background: transparent; border: 2px solid var(--border); color: var(--silver); box-shadow: none; }
  button.estrai.secondary:hover { border-color: var(--accent); color: var(--accent); }

  /* pulsante "salva immagine": stessa forma dei bottoni secondari, ma in oro
     per distinguerlo come azione post-estrazione (compare solo a risultato pronto) */
  button.estrai.save-btn { border-color: var(--gold); color: var(--gold); }
  button.estrai.save-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(245,200,66,0.08); }

  /* ── Storico ── */
  .history {
    max-width: 720px; margin: 20px auto 0;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px; text-align: left;
    display: none;
  }
  .history .htitle {
    display: flex; justify-content: space-between; align-items: center;
    font-size: .78rem; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  .history .clear {
    font-size: .72rem; color: var(--muted); background: none; border: none;
    cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
  }
  .history .clear:hover { color: var(--accent); }
  .hitem {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 4px; border-bottom: 1px solid rgba(30,48,80,0.5);
    font-size: .9rem; animation: rowIn .25s ease both;
  }
  .hitem:last-child { border-bottom: none; }
  .hitem .pair { font-family: 'Share Tech Mono', monospace; }
  .hitem .pair .t { color: var(--accent); }
  .hitem .pair .v { color: var(--gold); }
  .hitem .time { font-size: .74rem; color: var(--muted); }
  @keyframes rowIn { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:none; } }

  footer { margin-top: 26px; font-size: .74rem; color: var(--muted); letter-spacing: 1px; }
</style>
</head>
<body>

<header>
  <h1>🗡️ [legX] Valhalla Gladiators 🛡️</h1>
  <p>Lucky Train · Estrazione posizioni</p>
</header>

<div class="container">
  <div class="box">
    <h3>🚆 Conducente</h3>
    <div id="tableConducente" class="tbl"></div>
  </div>
  <div class="box">
    <h3>👑 VIP</h3>
    <div id="tableVip" class="tbl"></div>
  </div>
</div>

<div class="draw">
  <div class="reels">
    <div class="reel train">
      <div class="lbl">🚆 Conducente</div>
      <div class="val" id="valTrain">–</div>
    </div>
    <div class="reel vip">
      <div class="lbl">👑 VIP</div>
      <div class="val" id="valVip">–</div>
    </div>
  </div>
  <div class="explain" id="explain">Scegli cosa estrarre per il treno di oggi.</div>
  <div class="btn-group">
    <button class="estrai secondary" id="btnTrain">🚆 Solo Conducente</button>
    <button class="estrai" id="btnBoth">🎰 Entrambi</button>
    <button class="estrai secondary" id="btnVip">👑 Solo VIP</button>
    <button class="estrai secondary save-btn" id="btnSaveImg" style="display:none;">📸 Salva immagine</button>
  </div>
</div>

<div class="history" id="history">
  <div class="htitle">
    <span>🕑 Ultime estrazioni</span>
    <button class="clear" id="clearHist">Svuota</button>
  </div>
  <div id="histList"></div>
</div>

<footer>© 2026 Rebysa · All Rights Reserved</footer>

<script>
const $ = id => document.getElementById(id);

/* ══════════════════════════════════════════════════════
   UNICA FONTE: bande peso → tabella E logica di estrazione
   (così non possono mai divergere)
   { pos: etichetta, w: peso, count: quante posizioni nella banda }
   ══════════════════════════════════════════════════════ */
const CONDUCENTE_BANDS = [
  { pos: "1",     w: 30 },
  { pos: "2",     w: 20 },
  { pos: "3",     w: 10 },
  { pos: "4",     w: 7  },
  { pos: "5",     w: 2  },
  { pos: "6-10",  w: 2, count: 5  },
  { pos: "11-30", w: 1, count: 20 },
];

// VIP: posizioni 1..15 con peso 15..1 decrescente, poi 16-30 peso 1
const VIP_BANDS = [];
for (let i = 1; i <= 15; i++) VIP_BANDS.push({ pos: String(i), w: 16 - i });
VIP_BANDS.push({ pos: "16-30", w: 1, count: 15 });

/* Espande le bande nell'array di pesi per posizione (indice 0 = pos 1) */
function expandWeights(bands) {
  const out = [];
  bands.forEach(b => { const n = b.count || 1; for (let k = 0; k < n; k++) out.push(b.w); });
  return out;
}
const wConducente = expandWeights(CONDUCENTE_BANDS);
const wVip        = expandWeights(VIP_BANDS);

/* Rende la tabella dalle bande mostrando la probabilità reale (peso ÷ totale) */
function renderTable(el, bands, total) {
  const fmtPct = p => p.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rows = bands.map(b => {
    const pct = (b.w / total) * 100;
    const each = (b.count && b.count > 1) ? `<span class="each"> ciascuno</span>` : "";
    return `<div class="row"><b>${b.pos}</b><span class="pct">${fmtPct(pct)}%${each}</span></div>`;
  });
  rows.push(`<div class="row total"><b>Totale</b><span class="pct">100%</span></div>`);
  el.innerHTML = rows.join("");
}
const totConducente = wConducente.reduce((a, b) => a + b, 0);
const totVip        = wVip.reduce((a, b) => a + b, 0);
renderTable($("tableConducente"), CONDUCENTE_BANDS, totConducente);
renderTable($("tableVip"), VIP_BANDS, totVip);

/* Estrazione pesata: ritorna la posizione (1-based) */
function estraiNumero(pesi) {
  const totale = pesi.reduce((a, b) => a + b, 0);
  let r = Math.random() * totale, acc = 0;
  for (let i = 0; i < pesi.length; i++) { acc += pesi[i]; if (r < acc) return i + 1; }
  return pesi.length;
}

/* ══════════════════════════════════════════════════════
   ESTRAZIONE con animazione a rullo + spiegazione + storico
   ══════════════════════════════════════════════════════ */
const valTrain = $("valTrain"), valVip = $("valVip"),
      explain = $("explain"), historyEl = $("history"), histList = $("histList"),
      btnTrain = $("btnTrain"), btnVip = $("btnVip"), btnBoth = $("btnBoth"),
      btnSaveImg = $("btnSaveImg");
const allBtns = [btnTrain, btnVip, btnBoth];

let history = [];
try { history = JSON.parse(localStorage.getItem("legx-train-history") || "[]"); } catch (_) {}
renderHistory();

function pulse(el){ el.classList.add("pulse"); setTimeout(()=>el.classList.remove("pulse"), 130); }

/* Ultimo risultato disponibile per l'export immagine — null finché non c'è
   ancora stata un'estrazione completa in questa sessione di pagina */
let currentResult = null;   // { train, vip, ts }

/* mode: "train" | "vip" | "both" */
function estrai(mode) {
  allBtns.forEach(b => b.disabled = true);
  btnSaveImg.style.display = "none";   // nasconde il pulsante finché il nuovo risultato non è pronto
  explain.textContent = "🎲 Estrazione in corso…";

  const doTrain = mode === "train" || mode === "both";
  const doVip   = mode === "vip"   || mode === "both";
  const finalTrain = doTrain ? estraiNumero(wConducente) : null;
  const finalVip   = doVip   ? estraiNumero(wVip)        : null;

  // fase "rullo": solo i reel coinvolti girano, poi si fermano
  let ticks = 0;
  const iv = setInterval(() => {
    if (doTrain) { valTrain.textContent = 1 + Math.floor(Math.random() * 30); pulse(valTrain); }
    if (doVip)   { valVip.textContent   = 1 + Math.floor(Math.random() * 30); pulse(valVip); }
    if (++ticks >= 16) {
      clearInterval(iv);
      if (doTrain) { valTrain.textContent = finalTrain; pulse(valTrain); }
      if (doVip)   { valVip.textContent   = finalVip;   pulse(valVip); }
      showResult(finalTrain, finalVip);
      pushHistory(finalTrain, finalVip);
      allBtns.forEach(b => b.disabled = false);
    }
  }, 70);
}

function showResult(t, v) {
  const parts = [];
  if (t != null) parts.push(`Il treno va a chi è in posizione <b class="train">${t}</b>`);
  if (v != null) parts.push(`posto VIP alla posizione <b class="vip">${v}</b>`);
  explain.innerHTML = parts.join(" · ") + ".";
  currentResult = { train: t, vip: v, ts: Date.now() };
  btnSaveImg.style.display = "";   // torna al display di default (inline-block da .btn-group button.estrai)
}

function pushHistory(t, v) {
  const now = new Date();
  const time = now.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  const date = now.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
  history.unshift({ t, v, when: `${date} ${time}` });
  history = history.slice(0, 10);
  try { localStorage.setItem("legx-train-history", JSON.stringify(history)); } catch (_) {}
  renderHistory();
}

function renderHistory() {
  if (!history.length) { historyEl.style.display = "none"; return; }
  historyEl.style.display = "block";
  histList.innerHTML = history.map(h =>
    `<div class="hitem">
       <span class="pair">🚆 <span class="t">${h.t ?? "–"}</span> &nbsp; 👑 <span class="v">${h.v ?? "–"}</span></span>
       <span class="time">${h.when}</span>
     </div>`
  ).join("");
}

btnTrain.addEventListener("click", () => estrai("train"));
btnVip.addEventListener("click",   () => estrai("vip"));
btnBoth.addEventListener("click",  () => estrai("both"));
$("clearHist").addEventListener("click", () => {
  history = [];
  try { localStorage.removeItem("legx-train-history"); } catch (_) {}
  renderHistory();
});

/* ══════════════════════════════════════════════════════
   IMMAGINE DEL RISULTATO — disegnata a mano su <canvas>, stesso
   approccio del tool OCR gemello (legx-estrazione.html): niente
   html2canvas, zero dipendenze esterne, resa identica ovunque e
   nessun rischio che il font Google non sia ancora pronto allo
   scatto. Qui però i "vincitori" possono essere due (Conducente
   + VIP): se entrambi presenti diventano due colonne allineate
   sulla stessa riga, altrimenti un unico blocco centrato.
   ══════════════════════════════════════════════════════ */
function sanitizeFilename(s) {
  return String(s).replace(/[\\/:*?"<>|]+/g, "_").trim() || "risultato";
}
function drawRoundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function downloadResultImage() {
  if (!currentResult) return;
  const { train, vip, ts } = currentResult;
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (_) {}

  // Layout costruito sulle dimensioni REALI del testo (measureText con
  // bounding box), non su margini indovinati: ogni riga occupa solo lo
  // spazio che le serve + un piccolo respiro fisso. SCALE=2 → risoluzione
  // raddoppiata, testo nitido anche ingrandito.
  const SCALE = 2;
  const W = 900 * SCALE, pad = 22 * SCALE, edgeInset = 22 * SCALE;
  const mc = document.createElement("canvas").getContext("2d");
  function lineMetrics(text, font) {
    mc.font = font;
    const tm = mc.measureText(text);
    const asc = tm.actualBoundingBoxAscent || parseInt(font, 10) * 0.78;
    const desc = tm.actualBoundingBoxDescent || parseInt(font, 10) * 0.22;
    return { asc, desc };
  }

  const brandFont     = `700 ${26 * SCALE}px "Rajdhani", sans-serif`;
  const labelFont      = `600 ${20 * SCALE}px "Rajdhani", sans-serif`;
  const reelLabelFont = `700 ${20 * SCALE}px "Rajdhani", sans-serif`;
  const reelValFont   = `700 ${72 * SCALE}px "Share Tech Mono", monospace`;
  const metaFont       = `500 ${20 * SCALE}px "Rajdhani", sans-serif`;
  const footerFont     = `600 ${18 * SCALE}px "Rajdhani", sans-serif`;

  const both = train != null && vip != null;
  const dd = new Date(ts).toLocaleString("it-IT", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
  const modeText  = both ? "Estrazione doppia" : (train != null ? "Solo Conducente" : "Solo VIP");
  const metaText   = `${modeText} · ${dd}`;
  const footerText = "© 2026 Rebysa · All Rights Reserved";

  const cols = [];
  if (train != null) cols.push({ label: "🚆 Conducente", val: String(train), color: "#38bdf8" });
  if (vip   != null) cols.push({ label: "👑 VIP",          val: String(vip),   color: "#f5c842" });

  const mBrand     = lineMetrics("🗡️ [legX] Valhalla Gladiators", brandFont);
  const mLabel     = lineMetrics("Lucky Train · Estrazione posizioni", labelFont);
  const mReelLabel = lineMetrics("🚆 Conducente", reelLabelFont);   // etichetta più lunga tra le due possibili
  const mReelVal   = lineMetrics("30", reelValFont);                // due cifre = altezza massima possibile
  const mMeta      = lineMetrics(metaText, metaFont);
  const mFooter    = lineMetrics(footerText, footerFont);

  // avanzamento riga = discesa della riga precedente + un piccolo respiro fisso + salita della prossima
  let y = pad + edgeInset + mBrand.asc;
  const yBrand = y; y += mBrand.desc + 12 * SCALE + mLabel.asc;
  const yLabel = y; y += mLabel.desc + 34 * SCALE + mReelLabel.asc;
  const yReelLabel = y; y += mReelLabel.desc + 14 * SCALE + mReelVal.asc;
  const yReelVal = y; y += mReelVal.desc + 30 * SCALE + mMeta.asc;
  const yMeta = y; y += mMeta.desc;
  const dividerY = y + 16 * SCALE;
  y = dividerY + 14 * SCALE + mFooter.asc;
  const yFooter = y; y += mFooter.desc;
  const H = y + edgeInset + pad;

  const cnv = document.createElement("canvas");
  cnv.width = W; cnv.height = H;
  const c = cnv.getContext("2d");

  // sfondo
  c.fillStyle = "#090e1a"; c.fillRect(0, 0, W, H);
  const glow = c.createRadialGradient(W / 2, H * 0.4, 20 * SCALE, W / 2, H * 0.4, W * 0.65);
  glow.addColorStop(0, "rgba(56,189,248,0.14)"); glow.addColorStop(1, "rgba(56,189,248,0)");
  c.fillStyle = glow; c.fillRect(0, 0, W, H);

  // scheda
  drawRoundedRect(c, pad, pad, W - pad * 2, H - pad * 2, 20 * SCALE);
  c.fillStyle = "rgba(56,189,248,0.07)"; c.fill();
  c.lineWidth = 2 * SCALE; c.strokeStyle = "rgba(56,189,248,0.35)"; c.stroke();

  c.textAlign = "center";

  c.fillStyle = "#38bdf8"; c.font = brandFont;
  c.fillText("🗡️ [legX] Valhalla Gladiators", W / 2, yBrand);

  c.fillStyle = "#a8b8d0"; c.font = labelFont;
  c.fillText("Lucky Train · Estrazione posizioni", W / 2, yLabel);

  // reel(s): due colonne se entrambi presenti, una colonna centrata altrimenti
  if (cols.length === 2) {
    const cx1 = W * 0.28, cx2 = W * 0.72;
    c.font = reelLabelFont; c.fillStyle = "#a8b8d0";
    c.fillText(cols[0].label, cx1, yReelLabel);
    c.fillText(cols[1].label, cx2, yReelLabel);
    c.font = reelValFont;
    c.fillStyle = cols[0].color; c.fillText(cols[0].val, cx1, yReelVal);
    c.fillStyle = cols[1].color; c.fillText(cols[1].val, cx2, yReelVal);
  } else {
    const cx = W / 2;
    c.font = reelLabelFont; c.fillStyle = "#a8b8d0";
    c.fillText(cols[0].label, cx, yReelLabel);
    c.font = reelValFont; c.fillStyle = cols[0].color;
    c.fillText(cols[0].val, cx, yReelVal);
  }

  c.fillStyle = "#4a6080"; c.font = metaFont;
  c.fillText(metaText, W / 2, yMeta);

  c.strokeStyle = "#1e3050"; c.lineWidth = 1 * SCALE;
  c.beginPath(); c.moveTo(pad + 80 * SCALE, dividerY); c.lineTo(W - pad - 80 * SCALE, dividerY); c.stroke();
  c.fillStyle = "#4a6080"; c.font = footerFont;
  c.fillText(footerText, W / 2, yFooter);

  const blob = await new Promise(resolve => cnv.toBlob(resolve, "image/png"));
  if (!blob) return;
  const url = URL.createObjectURL(blob);
  const stamp = new Date(ts);
  const pad2 = n => String(n).padStart(2, "0");
  const tag = both ? `T${train}-V${vip}` : (train != null ? `T${train}` : `V${vip}`);
  const fname = `legX-treno-${sanitizeFilename(tag)}-${stamp.getFullYear()}${pad2(stamp.getMonth() + 1)}${pad2(stamp.getDate())}-${pad2(stamp.getHours())}${pad2(stamp.getMinutes())}.png`;
  const a = document.createElement("a");
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
btnSaveImg.addEventListener("click", downloadResultImage);
</script>
